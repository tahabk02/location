<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Primordial -->
    <title>AVENIR KAMIL CAR | Location de Voitures de Prestige & Sport</title>
    <meta name="description" content="Découvrez AVENIR KAMIL CAR, votre partenaire privilégié pour la location de voitures de luxe et de sport. Service premium ultra pro et large flotte de véhicules d'exception." />
    <meta name="keywords" content="location voiture luxe, location voiture sport, premium car rental, AVENIR KAMIL CAR, voiture prestige" />
    <meta name="author" content="AVENIR KAMIL CAR" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avenirkamilcar.ma/" />
    <meta property="og:title" content="AVENIR KAMIL CAR | Location de Voitures de Prestige" />
    <meta property="og:description" content="Découvrez une expérience de conduite inégalée avec AVENIR KAMIL CAR et notre flotte de véhicules de luxe." />
    <meta property="og:image" content="/logo.jpeg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="AVENIR KAMIL CAR | Location de Voitures de Prestige" />
    <meta property="twitter:description" content="Louez les meilleures voitures de luxe et de sport avec AVENIR KAMIL CAR." />

    <!-- Performance: Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <style>
      /* Splash screen simple pour le chargement */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030712;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .loader-spin {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-spin"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      });
    </script>
  </body>
</html>
